<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">FeatherSurf — a lighter browser</title>
  <desc id="desc">A FeatherSurf promotional banner with a feather logo and the phrase More web, less RAM.</desc>
