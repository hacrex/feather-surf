[build]
# Default target (host machine)
# target is set per-platform in build scripts
target = "x86_64-pc-windows-gnu"

[target.x86_64-pc-windows-gnu]
linker = "C:\\mingw64\\bin\\x86_64-w64-mingw32-gcc.exe"

[target.'cfg(target_os = "linux")']
# Linux x64 - GCC toolchain
linker = "x86_64-linux-gnu-gcc"

[target.'cfg(target_os = "macos")']
# macOS - Clang toolchain
linker = "clang"

[target.'cfg(target_os = "android")']
# Android NDK toolchain
# Actual linker path set by NDK_HOME env var in build scripts

[target.'cfg(target_os = "ios")']
# iOS - Xcode toolchain
# Uses the iOS SDK linker from Xcode

[profile.release]
lto = true
opt-level = "z"
strip = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
