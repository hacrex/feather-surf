[package]
name = "feathersurf-session-manager"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Session persistence and restoration for FeatherSurf"

[dependencies]
tab_manager = { package = "feathersurf-tab-manager", path = "../tab-manager" }
serde = { version = "1", features = ["derive"] }
bincode = "1"
serde_json = "1"
thiserror = "2"

[dev-dependencies]
proptest = "1"
tempfile = "3"
