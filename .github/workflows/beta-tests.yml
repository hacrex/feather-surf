# FeatherSurf Beta Testing Workflow
#
# Runs comprehensive tests for beta releases.

name: Beta Tests

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to test'
        required: true
      platforms:
        description: 'Platforms to test'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - linux
          - macos
          - android
          - ios

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Reliability Tests ───────────────────────────────────────────
  reliability:
    name: Reliability Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run reliability tests
        run: cargo test --release -p feathersurf-beta-testing -- reliability

      - name: Soak test (24h simulation)
        run: cargo test --release -p feathersurf-beta-testing -- soak_test
        timeout-minutes: 60

      - name: Stress test (suspend/restore cycles)
        run: cargo test --release -p feathersurf-beta-testing -- stress_test

  # ── Compatibility Tests ─────────────────────────────────────────
  compatibility:
    name: Compatibility Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run compatibility tests
        run: cargo test --release -p feathersurf-beta-testing -- compatibility

      - name: Website compatibility tests
        run: cargo test --release -p feathersurf-beta-testing -- website_tests

  # ── Privacy & Security Tests ────────────────────────────────────
  privacy-security:
    name: Privacy & Security Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run privacy tests
        run: cargo test --release -p feathersurf-beta-testing -- privacy_tests

      - name: Run security tests
        run: cargo test --release -p feathersurf-beta-testing -- security_tests

      - name: Run audit
        run: cargo audit

  # ── Android Tests ───────────────────────────────────────────────
  android:
    name: Android Tests
    runs-on: ubuntu-latest
    if: inputs.platforms == 'all' || inputs.platforms == 'android'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android app
        run: ./gradlew assembleDebug

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: ./gradlew connectedDebugAndroidTest

  # ── iOS Tests ───────────────────────────────────────────────────
  ios:
    name: iOS Tests
    runs-on: macos-latest
    if: inputs.platforms == 'all' || inputs.platforms == 'ios'

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build iOS app
        run: |
          xcodebuild -project ios/FeatherSurf.xcodeproj \
            -scheme FeatherSurf \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.0' \
            build

      - name: Run tests
        run: |
          xcodebuild -project ios/FeatherSurf.xcodeproj \
            -scheme FeatherSurf \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.0' \
            test

  # ── Generate Report ─────────────────────────────────────────────
  report:
    name: Generate Test Report
    runs-on: ubuntu-latest
    needs: [reliability, compatibility, privacy-security]
    steps:
      - uses: actions/checkout@v4

      - name: Generate report
        run: cargo run --release -p feathersurf-beta-testing -- generate-report

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: beta-test-report
          path: |
            target/beta-test-report.json
            target/beta-test-report.md
